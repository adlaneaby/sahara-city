<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sahara City</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#2b1a10;color:#fff3e0;font-family:Georgia,'Times New Roman',serif}
canvas{display:block}
button,input{font:inherit}
.btn{background:#e8a33d;color:#2b1a10;border:0;padding:10px 14px;border-radius:6px;font-weight:bold}
.btn.alt{background:#4a2f1d;color:#fff3e0;border:1px solid #8a5a35}
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#f2b45a,#c4592b 60%,#2b1a10);z-index:10}
#auth .box{width:min(340px,90vw);background:#2b1a10ee;padding:22px;border-radius:10px;display:flex;flex-direction:column;gap:10px}
#auth h1{font-size:34px;letter-spacing:1px}
#auth input{padding:10px;border-radius:6px;border:1px solid #8a5a35;background:#3d2616;color:#fff}
#msg{color:#ff9a7a;min-height:18px;font-size:14px}
#hud{position:fixed;top:0;left:0;right:0;display:none;justify-content:space-between;padding:10px;gap:8px;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
#money{background:#2b1a10cc;padding:8px 12px;border-radius:6px;font-weight:bold}
#bar{position:fixed;bottom:12px;left:12px;display:none;gap:8px;z-index:5}
#pad{position:fixed;bottom:12px;right:12px;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;z-index:5}
#pad button{background:#2b1a10cc;color:#fff3e0;border:1px solid #8a5a35;border-radius:8px;font-size:22px;touch-action:none}
.panel{position:fixed;inset:8% 5%;max-width:520px;margin:auto;background:#2b1a10f2;border:1px solid #8a5a35;border-radius:10px;padding:16px;z-index:8;display:none;overflow:auto;max-height:84%}
.panel h2{margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #4a2f1d}
.panel input{padding:8px;border-radius:6px;border:1px solid #8a5a35;background:#3d2616;color:#fff;width:100%;margin:4px 0}
.x{float:right}

#clock{background:#2b1a10cc;padding:8px 12px;border-radius:6px;font-weight:bold}
#dmg{position:fixed;top:54px;left:50%;transform:translateX(-50%);width:210px;background:#2b1a10cc;border-radius:6px;padding:6px 8px;font-size:13px;text-align:center;z-index:5;display:none}
#dmg i{display:block;height:6px;margin-top:4px;border-radius:3px;background:#4c4;width:100%}
#pPhone{background:none;border:0;padding:0;overflow:visible;inset:0;max-width:none;max-height:none;margin:0;width:100%;height:100%}
.phone{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);height:min(640px,92vh);aspect-ratio:9/19;padding:9px;border-radius:46px;
 background:linear-gradient(145deg,#8a8a90,#2b2b2e 35%,#1a1a1c 70%,#555);box-shadow:0 20px 60px #000a,inset 0 0 0 2px #0008,inset 0 0 6px 2px #fff3}
.phone:before{content:"";position:absolute;right:-3px;top:130px;width:3px;height:60px;background:#555;border-radius:0 2px 2px 0}
.phone:after{content:"";position:absolute;left:-3px;top:110px;width:3px;height:36px;background:#555;border-radius:2px 0 0 2px}
.scr{position:relative;height:100%;border-radius:38px;overflow:hidden;color:#fff;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
 background:radial-gradient(circle at 30% 20%,#ffb15a,#c4592b 45%,#3a1d3f 85%)}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:34%;height:24px;background:#000;border-radius:14px;z-index:3}
.sb{display:flex;justify-content:space-between;padding:14px 26px 0;font-size:13px;font-weight:600;position:relative;z-index:2}
#pBody{padding:18px 16px 60px;height:calc(100% - 20px);overflow:auto}
.wid{background:#ffffff26;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;padding:16px;margin-bottom:18px;text-align:center}
.wid b{display:block;font-size:44px;font-weight:300}.wid small{opacity:.8}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.ic{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;cursor:pointer}
.ic .i{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 2px 6px #0006,inset 0 1px 1px #fff6}
.ttl{font-size:20px;font-weight:700;margin:4px 0 12px;cursor:pointer}
.cell{background:#ffffff26;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px;padding:12px;margin-bottom:8px;font-size:14px}
.hp{height:8px;background:#0006;border-radius:4px;margin:8px 0 4px;overflow:hidden}.hp i{display:block;height:100%;background:#5fe27f}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:36%;height:5px;border-radius:3px;background:#fffd;cursor:pointer;z-index:4}
.home:before{content:"";position:absolute;inset:-12px -20px}
</style>
</head>
<body>

<div id="auth"><div class="box">
  <h1>Sahara City</h1>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="un" placeholder="Username (sign up only)">
  <input id="pw" type="password" placeholder="Password (6+ characters)">
  <div id="msg"></div>
  <button class="btn" id="login">Log in</button>
  <button class="btn alt" id="signup">Create account</button>
</div></div>

<div id="hud"><div id="money">$0</div><div id="clock"></div><div id="who"></div></div>
<div id="dmg"><span>Car</span><i></i></div>
<div id="bar">
  <button class="btn" id="bShop">Shop</button>
  <button class="btn alt" id="bPhone">Phone</button>
  <button class="btn alt" id="bMode">Drive</button>
  <button class="btn alt" id="bAdmin" style="display:none">Admin</button>
</div>
<div id="pad"><span></span><button data-k="w">▲</button><span></span><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>

<div class="panel" id="pShop"><button class="btn alt x" data-close>Close</button><h2>Shop</h2><div id="shopList"></div></div>
<div class="panel" id="pPhone"><div class="phone"><div class="scr"><div class="island"></div><div class="sb"><span id="pClock">08:00</span><span>5G ▂▄▆█ 🔋</span></div><div id="pBody"></div><div class="home" id="pHome"></div></div></div></div>
<div class="panel" id="pAdmin"><button class="btn alt x" data-close>Close</button><h2>Admin</h2>
  <input id="aUser" placeholder="Player username">
  <input id="aAmt" type="number" placeholder="Money amount">
  <div class="row"><button class="btn" id="aMoney">Give money</button><button class="btn alt" id="aKick">Kick</button></div>
  <div class="row"><button class="btn alt" id="aBan">Ban</button><button class="btn alt" id="aUnban">Unban</button></div>
  <select id="aItem" class="btn alt" style="width:100%;margin-top:6px"></select>
  <button class="btn" id="aGive" style="margin-top:6px;width:100%">Give item free</button>
  <div id="aMsg" style="margin-top:8px;font-size:14px"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ========== SETUP: paste your Firebase config and admin email ========== */
const firebaseConfig = {
  apiKey: "AIzaSyBYZRaIEIC_HKz7vsbNuTsu_if18pveGXc",
  authDomain: "sahara-city-8bfc3.firebaseapp.com",
  projectId: "sahara-city-8bfc3",
  storageBucket: "sahara-city-8bfc3.firebasestorage.app",
  messagingSenderId: "1075227339347",
  appId: "1:1075227339347:web:efe5e814e1e81a3440f4a6"
};
const ADMIN_EMAIL = "adlane.aby@gmail.com";
/* Firestore rules (Firebase console > Firestore > Rules), replace the email:
rules_version='2'; service cloud.firestore { match /databases/{d}/documents {
 match /users/{u} {
  allow read: if request.auth != null;
  allow create: if request.auth.uid == u && request.resource.data.banned == false;
  allow update: if request.auth.token.email == 'adlane.aby@gmail.com'
    || (request.auth.uid == u && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['banned','kickAt']));
 }}}
*/

const CATALOG = {
  cars:[{id:'c1',name:'Old Peugeot 205',price:3000,color:0xb0b0b0},{id:'c2',name:'Toyota Hilux',price:15000,color:0x3a5f3a},{id:'c3',name:'Sport Coupe',price:60000,color:0xc0281c}],
  houses:[{id:'h1',name:'Casbah flat, Algiers',price:20000},{id:'h2',name:'Oran seaside villa',price:90000},{id:'h3',name:'Sahara desert lodge',price:40000}]
};
const ALL = [...CATALOG.cars.map(x=>({...x,type:'cars'})),...CATALOG.houses.map(x=>({...x,type:'houses'}))];
const $ = id => document.getElementById(id);
let db, auth, me=null, ref=null, loginAt=Date.now(), THREE_started=false;

try{ firebase.initializeApp(firebaseConfig); auth=firebase.auth(); db=firebase.firestore(); }
catch(e){ $('msg').textContent='Add your Firebase config in index.html first.'; }

const msg = t => $('msg').textContent = t;
$('signup').onclick = async () => {
  const email=$('em').value.trim(), pw=$('pw').value, name=$('un').value.trim();
  if(name.length<3) return msg('Pick a username with 3+ characters.');
  try{
    const c = await auth.createUserWithEmailAndPassword(email,pw);
    await db.collection('users').doc(c.user.uid).set({username:name,email,money:5000,cars:[],houses:[],banned:false,kickAt:0});
  }catch(e){ msg(e.message); }
};
$('login').onclick = async () => {
  try{ await auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value); }catch(e){ msg(e.message); }
};

auth && auth.onAuthStateChanged(u => {
  if(!u){ $('auth').style.display='flex'; ['hud','bar','pad'].forEach(i=>$(i).style.display='none'); return; }
  loginAt=Date.now();
  ref=db.collection('users').doc(u.uid);
  ref.onSnapshot(s=>{
    if(!s.exists) return;
    me=s.data(); me.uid=u.uid;
    if(me.banned){ msg('This account is banned.'); auth.signOut(); return; }
    if(me.kickAt && me.kickAt>loginAt){ msg('You were kicked by an admin.'); auth.signOut(); return; }
    $('auth').style.display='none'; $('hud').style.display='flex'; $('bar').style.display='flex'; $('pad').style.display='grid';
    $('money').textContent='$'+me.money.toLocaleString(); $('who').textContent=me.username;
    $('bAdmin').style.display = ((u.email||'').toLowerCase()===ADMIN_EMAIL)?'inline-block':'none';
    renderShop(); renderOwned();
    if(!THREE_started){ THREE_started=true; startGame(); }
  });
});

/* ---------- panels ---------- */
const show = id => { document.querySelectorAll('.panel').forEach(p=>p.style.display='none'); $(id).style.display='block'; };
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.parentElement.style.display='none');
$('bShop').onclick=()=>show('pShop'); $('bPhone').onclick=()=>show('pPhone'); $('bAdmin').onclick=()=>show('pAdmin');
$('aItem').innerHTML = ALL.map(i=>`<option value="${i.type}:${i.id}">${i.name}</option>`).join('');

function renderShop(){
  $('shopList').innerHTML = ALL.map(i=>{
    const has=(me[i.type]||[]).includes(i.id);
    return `<div class="row"><span>${i.name}<br><small>$${i.price.toLocaleString()}</small></span>
      <button class="btn" ${has?'disabled':''} onclick="buy('${i.type}','${i.id}')">${has?'Owned':'Buy'}</button></div>`;
  }).join('');
}
function renderOwned(){
  const list = ALL.filter(i=>(me[i.type]||[]).includes(i.id));
  $('owned').innerHTML = list.length ? list.map(i=>`<div class="row">${i.name}</div>`).join('') : '<div class="row">Nothing yet. Visit the shop.</div>';
}
window.buy = async (type,id) => {
  const item = ALL.find(i=>i.type===type&&i.id===id);
  if(me.money<item.price) return alert('Not enough money.');
  await ref.update({money:firebase.firestore.FieldValue.increment(-item.price),[type]:firebase.firestore.FieldValue.arrayUnion(id)});
};

/* ---------- admin ---------- */
async function findUser(){
  const n=$('aUser').value.trim();
  const q=await db.collection('users').where('username','==',n).limit(1).get();
  if(q.empty){ $('aMsg').textContent='Player not found.'; return null; }
  return q.docs[0].ref;
}
const done = t => $('aMsg').textContent=t;
$('aMoney').onclick=async()=>{const r=await findUser(); if(r){await r.update({money:firebase.firestore.FieldValue.increment(+$('aAmt').value||0)}); done('Money sent.');}};
$('aKick').onclick=async()=>{const r=await findUser(); if(r){await r.update({kickAt:Date.now()}); done('Player kicked.');}};
$('aBan').onclick=async()=>{const r=await findUser(); if(r){await r.update({banned:true}); done('Player banned.');}};
$('aUnban').onclick=async()=>{const r=await findUser(); if(r){await r.update({banned:false}); done('Player unbanned.');}};
$('aGive').onclick=async()=>{const r=await findUser(); if(!r) return; const [t,id]=$('aItem').value.split(':');
  await r.update({[t]:firebase.firestore.FieldValue.arrayUnion(id)}); done('Item given.');};

/* ---------- shared state, clock, audio ---------- */
const G={hp:100,reset(){}},clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const T0=performance.now(),gameHour=()=>(8+(performance.now()-T0)/120000)%24; // 1 game hour = 2 real minutes
const fmt=h=>String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor(h%1*60)).padStart(2,'0');
const A={ctx:null,on:true};
function initAudio(){
  if(A.ctx){A.ctx.resume();return;} const c=A.ctx=new(window.AudioContext||window.webkitAudioContext)();
  A.master=c.createGain();A.master.gain.value=.6;A.master.connect(c.destination);
  const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;A.noise=nb;
  const loop=(type,f)=>{const s=c.createBufferSource();s.buffer=nb;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=c.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(A.master);s.start();return g;};
  A.wind=loop('bandpass',500);A.sea=loop('lowpass',350);
  A.e1=c.createOscillator();A.e1.type='sawtooth';A.e2=c.createOscillator();A.e2.type='square';
  const ef=c.createBiquadFilter();ef.type='lowpass';ef.frequency.value=500;A.eg=c.createGain();A.eg.gain.value=0;
  A.e1.connect(ef);A.e2.connect(ef);ef.connect(A.eg);A.eg.connect(A.master);A.e1.start();A.e2.start();A.ef=ef;
  const cr=c.createOscillator(),lfo=c.createOscillator(),lg=c.createGain(),cm=c.createGain();cr.frequency.value=4300;lfo.frequency.value=13;lg.gain.value=.5;cm.gain.value=.5;
  A.cg=c.createGain();A.cg.gain.value=0;lfo.connect(lg);lg.connect(cm.gain);cr.connect(cm);cm.connect(A.cg);A.cg.connect(A.master);cr.start();lfo.start();
}
function burst(dur,f,vol,type){if(!A.ctx||!A.on)return;const c=A.ctx,s=c.createBufferSource();s.buffer=A.noise;const fl=c.createBiquadFilter();fl.type=type||'lowpass';fl.frequency.value=f;const g=c.createGain();g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);s.connect(fl);fl.connect(g);g.connect(A.master);s.start();s.stop(c.currentTime+dur);}
function tone(f,dur,vol,type){if(!A.ctx||!A.on)return;const c=A.ctx,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.connect(g);g.connect(A.master);o.start();o.stop(c.currentTime+dur);}
const beep=()=>tone(900,.05,.07),horn=()=>{tone(420,.45,.22,'square');tone(530,.45,.18,'square');},
  crashSnd=p=>{burst(.8,900,Math.min(1,p/12)+.25);burst(.3,3500,.3,'highpass');tone(55,.5,.6)};
['pointerdown','keydown'].forEach(e=>addEventListener(e,initAudio));
document.addEventListener('click',e=>{if(e.target.closest('button'))beep();});
{const hb=document.createElement('button'),sb=document.createElement('button');hb.className=sb.className='btn alt';hb.textContent='Horn';sb.textContent='Sound: on';
 hb.onclick=horn;sb.onclick=()=>{A.on=!A.on;if(A.master)A.master.gain.value=A.on?.6:0;sb.textContent='Sound: '+(A.on?'on':'off');};$('bar').append(hb,sb);}
addEventListener('keydown',e=>{if(e.key==='h'&&e.target.tagName!=='INPUT')horn();});

/* ---------- phone ---------- */
let phoneApp=null;
const APPS=[['garage','🚗','Garage','linear-gradient(#ffb340,#ff7a00)'],['homes','🏠','Homes','linear-gradient(#5fe27f,#1fa84a)'],['bank','💳','Bank','linear-gradient(#4aa8ff,#0a5fd8)'],['clock','🕒','Clock','linear-gradient(#444,#111)'],
 ['msg','💬','Messages','linear-gradient(#6cf07f,#22b54a)'],['market','🛒','Market','linear-gradient(#ff5c7a,#d11a45)'],['police','🚓','Police','linear-gradient(#8a85ff,#4339d6)'],['maps','🗺️','Maps','linear-gradient(#7fe0ff,#2a9bd8)']];
window.openApp=a=>{if(['msg','market','police','maps'].includes(a))return;phoneApp=a;renderPhone();};
window.repairCar=async()=>{const c=Math.ceil((100-G.hp)*40);if(me.money<c)return alert('Not enough money.');await ref.update({money:firebase.firestore.FieldValue.increment(-c)});G.reset();renderPhone();};
function renderPhone(){
  if(!me||!$('pBody'))return; const b=$('pBody'),ow=t=>ALL.filter(i=>i.type===t&&(me[t]||[]).includes(i.id));
  if(!phoneApp){b.innerHTML=`<div class="wid"><b id="wT">${fmt(gameHour())}</b><small>Sahara City</small></div><div class="grid">${APPS.map(a=>`<div class="ic" onclick="openApp('${a[0]}')"><div class="i" style="background:${a[3]}">${a[1]}</div><span>${a[2]}</span></div>`).join('')}</div>`;return;}
  const cost=Math.ceil((100-G.hp)*40),cells=l=>l.length?l.map(i=>`<div class="cell"><b>${i.name}</b></div>`).join(''):'<div class="cell">Nothing yet.</div>';
  const pages={
    garage:cells(ow('cars'))+(ow('cars').length?`<div class="cell">Condition of your car<div class="hp"><i style="width:${G.hp}%"></i></div><small>${Math.round(G.hp)}%</small><br><button class="btn" style="margin-top:8px" onclick="repairCar()" ${G.hp>=99?'disabled':''}>Repair $${cost.toLocaleString()}</button></div>`:''),
    homes:cells(ow('houses')),
    bank:`<div class="cell"><small>Balance</small><br><b style="font-size:26px">$${me.money.toLocaleString()}</b></div>`,
    clock:`<div class="cell"><b style="font-size:34px" id="wT">${fmt(gameHour())}</b><br><small>1 game hour = 2 real minutes</small></div>`};
  b.innerHTML=`<div class="ttl" onclick="phoneApp=null;renderPhone()">‹ ${APPS.find(a=>a[0]===phoneApp)[2]}</div>${pages[phoneApp]}`;
}
function renderOwned(){renderPhone();}
$('pHome').onclick=()=>{if(phoneApp){phoneApp=null;renderPhone();}else $('pPhone').style.display='none';};

/* ---------- 3D world ---------- */
function startGame(){
  const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xbfdcf0,70,330);
  const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,900);
  const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));
  r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
  document.body.prepend(r.domElement);
  // reflection environment (PBR image-based light)
  {const es=new THREE.Scene(),eg=new THREE.SphereGeometry(50,16,12),p=eg.attributes.position,cols=[];
   for(let i=0;i<p.count;i++){const y=p.getY(i)/50,c=y<0?new THREE.Color(0xc9a46a):new THREE.Color(0xbcd6ea).lerp(new THREE.Color(0x3d78c8),clamp(y*1.5,0,1));cols.push(c.r,c.g,c.b);}
   eg.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));es.add(new THREE.Mesh(eg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
   scene.environment=new THREE.PMREMGenerator(r).fromScene(es).texture;}
  const mats=[],P=(color,rough=.8,metal=0,o={})=>{const m=new THREE.MeshStandardMaterial(Object.assign({color,roughness:rough,metalness:metal},o));mats.push(m);return m;};
  const add=(g,m,x,y,z,cs=true)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=cs;o.receiveShadow=true;scene.add(o);return o;};
  const tx=(w,h,fn,rx=1,ry=1)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;};
  const grain=(g,w,h,base,n)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<n;i++){g.fillStyle=Math.random()<.5?'rgba(0,0,0,.09)':'rgba(255,255,255,.09)';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2);}};
  const glowTex=tx(64,64,g=>{const q=g.createRadialGradient(32,32,0,32,32,32);q.addColorStop(0,'rgba(255,255,255,1)');q.addColorStop(.3,'rgba(255,255,255,.35)');q.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=q;g.fillRect(0,0,64,64);});

  // sky / time-of-day update

    // audio

      A.e1.frequency.setTargetAtTime(45+sp*4.5,t,.08);A.e2.frequency.setTargetAtTime(22+sp*2.25,t,.08);A.ef.frequency.setTargetAtTime(350+sp*25,t,.1);A.eg.gain.setTargetAtTime(run?.05+.04*Math.abs(fwd)+sp*.0006:0,t,.1);
      A.wind.gain.setTargetAtTime((.02+sp*.003)*(1-night*.6),t,.2);A.sea.gain.setTargetAtTime(clamp((pp.z-90)/70,0,1)*.2,t,.3);A.cg.gain.setTargetAtTime(night*.012,t,.5);}
    // camera
    const d=driving?12:8;camT.set(pp.x-Math.sin(heading)*d,pp.y+(driving?5:4),pp.z-Math.cos(heading)*d);cam.position.lerp(camT,1-Math.exp(-9*dt));
    shake=Math.max(0,shake-dt*2.2);cam.position.add(rv(shake).sub(new THREE.Vector3(shake/2,0,shake/2)));cam.lookAt(pp.x,pp.y+2,pp.z);

    $('clock').textContent=(sunUp?'☀️ ':'🌙 ')+fmt(h);if($('pClock'))$('pClock').textContent=fmt(h);if($('wT'))$('wT').textContent=fmt(h);
    if(driving){$('dmg').firstChild.textContent=alive?'Car '+Math.round(G.hp)+'%':'Wrecked: repair in Phone > Garage';const b=$('dmg').lastChild;b.style.width=G.hp+'%';b.style.background=`hsl(${G.hp*1.2},80%,50%)`;}
    r.render(scene,cam);
  })();

}
