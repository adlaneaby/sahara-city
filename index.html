<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sahara City</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#1a100a;color:#fff3e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
canvas{display:block}
button,input,select{font:inherit}
.btn{background:linear-gradient(180deg,#f2b149,#d98a1e);color:#1e1108;border:0;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px #0006;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:#2d1c12dd;color:#fff3e0;border:1px solid #8a5a35;backdrop-filter:blur(8px)}
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 25%,#f2b45a,#c4592b 55%,#1f1109);z-index:10}
#auth .box{width:min(360px,90vw);background:#1f120be8;backdrop-filter:blur(14px);padding:26px;border-radius:14px;border:1px solid #8a5a3588;box-shadow:0 20px 50px #000b;display:flex;flex-direction:column;gap:11px}
#auth h1{font-size:34px;letter-spacing:1.5px;font-family:Georgia,'Times New Roman',serif;text-align:center;color:#ffd084}
#auth p.sub{text-align:center;font-size:12px;opacity:.75;margin-top:-6px;margin-bottom:4px}
#auth input{padding:11px;border-radius:8px;border:1px solid #8a5a35;background:#2e1c11;color:#fff}
#msg{color:#ff9a7a;min-height:18px;font-size:13px;text-align:center}
#hud{position:fixed;top:0;left:0;right:0;display:none;justify-content:space-between;align-items:center;padding:12px;gap:8px;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
#money,#clock,#who{background:#1d110acc;backdrop-filter:blur(8px);border:1px solid #8a5a3566;padding:8px 14px;border-radius:10px;font-weight:700;box-shadow:0 4px 12px #0005}
#money{color:#7dff9a}
#speedo{position:fixed;bottom:68px;right:16px;background:#1d110acc;backdrop-filter:blur(8px);border:1px solid #8a5a3566;padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;z-index:5;display:none;text-align:right}
#speedo span{font-size:22px;color:#ffd084}
#dmg{position:fixed;top:56px;left:50%;transform:translateX(-50%);width:220px;background:#1d110acc;backdrop-filter:blur(8px);border:1px solid #8a5a3566;border-radius:10px;padding:6px 10px;font-size:12px;text-align:center;z-index:5;display:none}
#dmg i{display:block;height:6px;margin-top:4px;border-radius:3px;background:#4c4;width:100%;transition:width .2s,background .2s}
#bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:none;gap:8px;z-index:5;flex-wrap:wrap;justify-content:center;max-width:96vw}
#pad{position:fixed;bottom:14px;left:14px;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;z-index:5}
#pad button{background:#1d110acc;color:#fff3e0;border:1px solid #8a5a35;border-radius:10px;font-size:20px;touch-action:none}
.panel{position:fixed;inset:8% 5%;max-width:520px;margin:auto;background:#1f120bf2;backdrop-filter:blur(14px);border:1px solid #8a5a35;border-radius:14px;padding:18px;z-index:8;display:none;overflow:auto;max-height:84%;box-shadow:0 20px 60px #000c}
.panel h2{margin-bottom:12px;color:#ffd084}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #4a2f1d}
.panel input{padding:9px;border-radius:8px;border:1px solid #8a5a35;background:#2e1c11;color:#fff;width:100%;margin:4px 0}
.x{float:right}

/* Realistic Smartphone UI */
#pPhone{background:none;border:0;padding:0;overflow:visible;inset:0;max-width:none;max-height:none;margin:0;width:100%;height:100%;pointer-events:none;box-shadow:none;backdrop-filter:none}
.phone{pointer-events:auto;position:fixed;right:16px;bottom:64px;transform:scale(.64);transform-origin:bottom right;height:min(640px,92vh);aspect-ratio:9/19;padding:9px;border-radius:46px;
 background:linear-gradient(145deg,#8a8a90,#2b2b2e 35%,#1a1a1c 70%,#555);box-shadow:0 20px 60px #000a,inset 0 0 0 2px #0008,inset 0 0 6px 2px #fff3}
.phone:before{content:"";position:absolute;right:-3px;top:130px;width:3px;height:60px;background:#555;border-radius:0 2px 2px 0}
.phone:after{content:"";position:absolute;left:-3px;top:110px;width:3px;height:36px;background:#555;border-radius:2px 0 0 2px}
.scr{position:relative;height:100%;border-radius:38px;overflow:hidden;color:#fff;
 background:radial-gradient(circle at 30% 20%,#ffb15a,#c4592b 45%,#281533 85%)}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:34%;height:24px;background:#000;border-radius:14px;z-index:3}
.sb{display:flex;justify-content:space-between;padding:14px 24px 0;font-size:12px;font-weight:600;position:relative;z-index:2}
#pBody{padding:18px 16px 60px;height:calc(100% - 20px);overflow:auto}
.wid{background:#ffffff24;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;padding:16px;margin-bottom:18px;text-align:center;border:1px solid #fff2}
.wid b{display:block;font-size:42px;font-weight:300}.wid small{opacity:.85}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.ic{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;cursor:pointer}
.ic .i{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 10px #0006,inset 0 1px 1px #fff6;transition:transform .12s}
.ic:hover .i{transform:scale(1.06)}
.ttl{font-size:20px;font-weight:700;margin:4px 0 12px;cursor:pointer}
.cell{background:#ffffff24;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px;padding:12px;margin-bottom:8px;font-size:14px;border:1px solid #fff2}
.hp{height:8px;background:#0006;border-radius:4px;margin:8px 0 4px;overflow:hidden}.hp i{display:block;height:100%;background:#5fe27f}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:36%;height:5px;border-radius:3px;background:#fffd;cursor:pointer;z-index:4}
.home:before{content:"";position:absolute;inset:-12px -20px}
#toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:#1d110ae8;border:1px solid #e8a33d;color:#fff3e0;padding:9px 16px;border-radius:10px;z-index:20;display:none;font-weight:600;box-shadow:0 8px 24px #0008}
#mapFull{position:fixed;inset:0;display:none;z-index:9;background:#0a161ff5}
#camHint{position:fixed;top:52px;right:14px;font-size:11px;opacity:.7;pointer-events:none;z-index:4;display:none}
</style>
</head>
<body>

<div id="auth"><div class="box">
  <h1>Sahara City</h1>
  <p class="sub">Algiers &amp; Sahara Open-World Edition</p>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="un" placeholder="Username (sign up only)">
  <input id="pw" type="password" placeholder="Password (6+ characters)">
  <div id="msg"></div>
  <button class="btn" id="login">Log in</button>
  <button class="btn alt" id="signup">Create account</button>
</div></div>

<div id="hud"><div id="money">$0</div><div id="clock">08:00</div><div id="who"></div></div>
<div id="camHint">Drag mouse to orbit camera · V change view</div>
<div id="dmg"><span>Car Condition</span><i></i></div>
<div id="speedo"><span>0</span> km/h</div>
<div id="bar">
  <button class="btn" id="bShop">Shop</button>
  <button class="btn alt" id="bPhone">Phone</button>
  <button class="btn alt" id="bMode">Walk</button>
  <button class="btn alt" id="bAdmin" style="display:none">Admin</button>
</div>
<div id="pad"><span></span><button data-k="w">▲</button><span></span><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>

<div class="panel" id="pShop"><button class="btn alt x" data-close>Close</button><h2>Dealership &amp; Real Estate</h2><div id="shopList"></div></div>
<div class="panel" id="pPhone"><div class="phone"><div class="scr"><div class="island"></div><div class="sb"><span id="pClock">08:00</span><span>5G ▂▄▆█ 🔋</span></div><div id="pBody"></div><div class="home" id="pHome"></div></div></div></div>
<div class="panel" id="pAdmin"><button class="btn alt x" data-close>Close</button><h2>Admin Console</h2>
  <input id="aUser" placeholder="Player username">
  <input id="aAmt" type="number" placeholder="Money amount">
  <div class="row"><button class="btn" id="aMoney">Give money</button><button class="btn alt" id="aKick">Kick</button></div>
  <div class="row"><button class="btn alt" id="aBan">Ban</button><button class="btn alt" id="aUnban">Unban</button></div>
  <select id="aItem" class="btn alt" style="width:100%;margin-top:6px"></select>
  <button class="btn" id="aGive" style="margin-top:6px;width:100%">Give item free</button>
  <div id="aMsg" style="margin-top:8px;font-size:14px;color:#7dff9a"></div>
</div>

<div class="panel" id="pSet"><button class="btn alt x" data-close>Close</button><h2>⚙ Graphics &amp; Settings</h2><div id="setBody"></div></div>
<div id="mapFull"><button class="btn alt" style="position:absolute;top:12px;right:12px;z-index:2" onclick="closeMap()">Close ✕</button><canvas id="mapC"></canvas></div>
<div id="toast"></div>

<!-- Three.js Core + Post-Processing Shaders -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* ========== SETUP: Firebase config & Admin Email ========== */
const firebaseConfig = {
  apiKey: "AIzaSyBYZRaIEIC_HKz7vsbNuTsu_if18pveGXc",
  authDomain: "sahara-city-8bfc3.firebaseapp.com",
  projectId: "sahara-city-8bfc3",
  storageBucket: "sahara-city-8bfc3.firebasestorage.app",
  messagingSenderId: "1075227339347",
  appId: "1:1075227339347:web:efe5e814e1e81a3440f4a6"
};
const ADMIN_EMAIL = "adlane.aby@gmail.com";

const CATALOG = {
  cars:[
    {id:'c1',name:'Old Peugeot 205',price:3000,color:0xc8c8c8,maxSpd:34,accel:20,handle:2.7},
    {id:'c2',name:'Toyota Hilux 4x4',price:15000,color:0x2f5233,maxSpd:44,accel:26,handle:2.5},
    {id:'c3',name:'Sport Coupe GT',price:60000,color:0xd11f17,maxSpd:64,accel:40,handle:3.2}
  ],
  houses:[
    {id:'h1',name:'Casbah flat, Algiers',price:20000},
    {id:'h2',name:'Oran seaside villa',price:90000},
    {id:'h3',name:'Sahara desert lodge',price:40000},
    {id:'h4',name:'Modern villa, Hydra',price:150000},
    {id:'h5',name:'Glass penthouse',price:320000},
    {id:'h6',name:'Loft near the Casino',price:75000}
  ]
};
const ALL = [...CATALOG.cars.map(x=>({...x,type:'cars'})),...CATALOG.houses.map(x=>({...x,type:'houses'}))];
const $ = id => document.getElementById(id);
let db, auth, me=null, ref=null, loginAt=Date.now(), THREE_started=false;

try{ firebase.initializeApp(firebaseConfig); auth=firebase.auth(); db=firebase.firestore(); }
catch(e){ $('msg').textContent='Firebase init error: '+e.message; }

const msg = t => $('msg').textContent = t;
$('signup').onclick = async () => {
  const email=$('em').value.trim(), pw=$('pw').value, name=$('un').value.trim();
  if(name.length<3) return msg('Pick a username with 3+ characters.');
  try{
    const c = await auth.createUserWithEmailAndPassword(email,pw);
    await db.collection('users').doc(c.user.uid).set({username:name,email,money:5000,cars:['c1'],houses:[],activeCar:'c1',banned:false,kickAt:0});
  }catch(e){ msg(e.message); }
};
$('login').onclick = async () => {
  try{ await auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value); }catch(e){ msg(e.message); }
};

auth && auth.onAuthStateChanged(u => {
  if(!u){
    $('auth').style.display='flex';
    ['hud','bar','pad','dmg','speedo','camHint'].forEach(i=>$(i).style.display='none');
    return;
  }
  loginAt=Date.now();
  ref=db.collection('users').doc(u.uid);
  ref.onSnapshot(s=>{
    if(!s.exists) return;
    me=s.data(); me.uid=u.uid;
    if(me.banned){ msg('This account is banned.'); auth.signOut(); return; }
    if(me.kickAt && me.kickAt>loginAt){ msg('You were kicked by an admin.'); auth.signOut(); return; }
    $('auth').style.display='none';
    $('hud').style.display='flex';
    $('bar').style.display='flex';
    $('pad').style.display='grid';
    $('camHint').style.display='block';
    $('money').textContent='$'+me.money.toLocaleString();
    $('who').textContent=me.username;
    $('bAdmin').style.display = ((u.email||'').toLowerCase()===ADMIN_EMAIL)?'inline-block':'none';
    renderShop(); renderPhone();
    if(G.syncCar) G.syncCar();
    if(!THREE_started){ THREE_started=true; startGame(); }
  });
});

/* ---------- panels ---------- */
const show = id => { document.querySelectorAll('.panel').forEach(p=>p.style.display='none'); $(id).style.display='block'; };
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.parentElement.style.display='none');
$('bShop').onclick=()=>show('pShop'); $('bPhone').onclick=()=>togPhone(); $('bAdmin').onclick=()=>show('pAdmin');
$('aItem').innerHTML = ALL.map(i=>`<option value="${i.type}:${i.id}">${i.name}</option>`).join('');

function renderShop(){
  if(!me) return;
  $('shopList').innerHTML = ALL.map(i=>{
    const has=(me[i.type]||[]).includes(i.id);
    const active = i.type==='cars' && (me.activeCar||((me.cars||[])[0]||'c1'))===i.id;
    return `<div class="row"><span><b>${i.name}</b><br><small style="opacity:.75">${i.type==='cars'?'Vehicle':'Property'} · $${i.price.toLocaleString()}</small></span>
      ${has ? (i.type==='cars' ? `<button class="btn ${active?'':'alt'}" onclick="selectCar('${i.id}')">${active?'Driving':'Drive this'}</button>` : `<button class="btn alt" disabled>Owned</button>`)
            : `<button class="btn" onclick="buy('${i.type}','${i.id}')">Buy</button>`}</div>`;
  }).join('');
}
window.selectCar = async (id) => {
  await ref.update({activeCar:id});
  toast('Selected '+ALL.find(x=>x.id===id).name);
};
window.buy = async (type,id) => {
  const item = ALL.find(i=>i.type===type&&i.id===id);
  if(me.money<item.price) return toast('Not enough money!');
  const upd = {money:firebase.firestore.FieldValue.increment(-item.price),[type]:firebase.firestore.FieldValue.arrayUnion(id)};
  if(type==='cars') upd.activeCar = id;
  await ref.update(upd);
  toast('Purchased '+item.name+'!');
};

/* ---------- admin ---------- */
async function findUser(){
  const n=$('aUser').value.trim();
  const q=await db.collection('users').where('username','==',n).limit(1).get();
  if(q.empty){ $('aMsg').textContent='Player not found.'; return null; }
  return q.docs[0].ref;
}
const done = t => $('aMsg').textContent=t;
$('aMoney').onclick=async()=>{const r=await findUser(); if(r){await r.update({money:firebase.firestore.FieldValue.increment(+$('aAmt').value||0)}); done('Money sent.');}};
$('aKick').onclick=async()=>{const r=await findUser(); if(r){await r.update({kickAt:Date.now()}); done('Player kicked.');}};
$('aBan').onclick=async()=>{const r=await findUser(); if(r){await r.update({banned:true}); done('Player banned.');}};
$('aUnban').onclick=async()=>{const r=await findUser(); if(r){await r.update({banned:false}); done('Player unbanned.');}};
$('aGive').onclick=async()=>{const r=await findUser(); if(!r) return; const [t,id]=$('aItem').value.split(':');
  await r.update({[t]:firebase.firestore.FieldValue.arrayUnion(id)}); done('Item given.');};

/* ---------- shared state, clock, audio ---------- */
const G={hp:100,mode:'drive',reset(){G.hp=100;},syncCar:null};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const T0=performance.now(),gameHour=()=>(8+(performance.now()-T0)/60000)%24;
const fmt=h=>String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor(h%1*60)).padStart(2,'0');
const A={ctx:null,on:true};
function initAudio(){
  if(A.ctx){A.ctx.resume();return;} const c=A.ctx=new(window.AudioContext||window.webkitAudioContext)();
  A.master=c.createGain();A.master.gain.value=S.vol/100;A.master.connect(c.destination);
  const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;A.noise=nb;
  const loop=(type,f)=>{const s=c.createBufferSource();s.buffer=nb;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=c.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(A.master);s.start();return g;};
  A.wind=loop('bandpass',500);A.sea=loop('lowpass',350);
  A.e1=c.createOscillator();A.e1.type='sawtooth';A.e2=c.createOscillator();A.e2.type='triangle';
  const ef=c.createBiquadFilter();ef.type='lowpass';ef.frequency.value=420;A.eg=c.createGain();A.eg.gain.value=0;
  A.e1.connect(ef);A.e2.connect(ef);ef.connect(A.eg);A.eg.connect(A.master);A.e1.start();A.e2.start();A.ef=ef;
}
function burst(dur,f,vol,type){if(!A.ctx||!A.on)return;const c=A.ctx,s=c.createBufferSource();s.buffer=A.noise;const fl=c.createBiquadFilter();fl.type=type||'lowpass';fl.frequency.value=f;const g=c.createGain();g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);s.connect(fl);fl.connect(g);g.connect(A.master);s.start();s.stop(c.currentTime+dur);}
function tone(f,dur,vol,type){if(!A.ctx||!A.on)return;const c=A.ctx,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.connect(g);g.connect(A.master);o.start();o.stop(c.currentTime+dur);}
const beep=()=>tone(900,.04,.05),horn=()=>{tone(410,.42,.2,'sawtooth');tone(515,.42,.18,'sawtooth');},
  crashSnd=p=>{burst(.7,850,Math.min(.9,p/14)+.2);burst(.25,3200,.25,'highpass');tone(58,.45,.5)};
['pointerdown','keydown'].forEach(e=>addEventListener(e,initAudio));
document.addEventListener('click',e=>{if(e.target.closest('button'))beep();});
{const hb=document.createElement('button'),sb=document.createElement('button');hb.className=sb.className='btn alt';hb.textContent='Horn';sb.textContent='Sound: on';
 hb.onclick=horn;sb.onclick=()=>{A.on=!A.on;if(A.master)A.master.gain.value=A.on?S.vol/100:0;sb.textContent='Sound: '+(A.on?'on':'off');};$('bar').append(hb,sb);}
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'&&e.target.tagName!=='INPUT')horn();});

/* ---------- phone ---------- */
let phoneApp=null;
const APPS=[['garage','🚗','Garage','linear-gradient(#ffb340,#ff7a00)'],['homes','🏠','Homes','linear-gradient(#5fe27f,#1fa84a)'],['bank','💳','Bank','linear-gradient(#4aa8ff,#0a5fd8)'],['clock','🕒','Clock','linear-gradient(#444,#111)'],
 ['msg','💬','Messages','linear-gradient(#6cf07f,#22b54a)'],['market','🛒','Market','linear-gradient(#ff5c7a,#d11a45)'],['police','🚓','Police','linear-gradient(#8a85ff,#4339d6)'],['maps','🗺️','Maps','linear-gradient(#7fe0ff,#2a9bd8)']];
window.openApp=a=>{if(a==='maps'){toggleMap();return;}if(a==='msg'){toast('No new messages in Algiers.');return;}if(a==='police'){toast('Algiers Police: Drive safely!');return;}phoneApp=a;renderPhone();};
window.repairCar=async()=>{const c=Math.ceil((100-G.hp)*40);if(me.money<c)return toast('Not enough money.');await ref.update({money:firebase.firestore.FieldValue.increment(-c)});G.reset();toast('Vehicle fully repaired!');renderPhone();};
function renderPhone(){
  if(!me||!$('pBody'))return; const b=$('pBody'),ow=t=>ALL.filter(i=>i.type===t&&(me[t]||[]).includes(i.id));
  if(!phoneApp){b.innerHTML=`<div class="wid"><b id="wT">${fmt(gameHour())}</b><small>Sahara City · Algiers</small></div><div class="grid">${APPS.map(a=>`<div class="ic" onclick="openApp('${a[0]}')"><div class="i" style="background:${a[3]}">${a[1]}</div><span>${a[2]}</span></div>`).join('')}</div>`;return;}
  const cost=Math.ceil((100-G.hp)*40);

    bank:`<div class="cell"><small>Balance</small><br><b style="font-size:26px;color:#7dff9a">$${me.money.toLocaleString()}</b></div>`,
    clock:`<div class="cell"><b style="font-size:34px" id="wT">${fmt(gameHour())}</b><br><small>1 game hour = 1 real minute</small></div>`};

function drawMap(){
  const c=$('mapC'),g=c.getContext('2d');
  if(c.width!==innerWidth||c.height!==innerHeight){c.width=innerWidth;c.height=innerHeight;}
  const s=Math.min((c.width-30)/1800,(c.height-60)/1100),ox=(c.width-1800*s)/2,oy=(c.height-1100*s)/2+10,X=x=>ox+(x+900)*s,Y=z=>oy+(200-z)*s;
  g.clearRect(0,0,c.width,c.height);
  g.fillStyle='#d9ae6a';g.fillRect(X(-900),Y(165),1800*s,1065*s);
  g.fillStyle='#19769e';g.fillRect(X(-900),Y(200),1800*s,35*s);
  g.strokeStyle='#3a3a40';g.lineWidth=Math.max(4,16*s);
  RD.forEach(r=>{g.beginPath();if(r.v){g.moveTo(X(r.c),Y(r.lo));g.lineTo(X(r.c),Y(r.hi));}else{g.moveTo(X(r.lo),Y(r.c));g.lineTo(X(r.hi),Y(r.c));}g.stroke();});
  g.fillStyle='#8a6a4a';
  WB.forEach(b=>g.fillRect(X(b.x-b.hx),Y(b.z+b.hz),Math.max(2,b.hx*2*s),Math.max(2,b.hz*2*s)));
  const T=(e,t,x,z,col)=>{
    g.font=Math.max(18,26*s)+'px sans-serif';g.textAlign='center';g.fillStyle='#000';g.fillText(e,X(x),Y(z));
    g.font='bold '+Math.max(10,13*s)+'px sans-serif';g.lineWidth=3;g.strokeStyle='#000';g.strokeText(t,X(x),Y(z)+16);
    g.fillStyle=col;g.fillText(t,X(x),Y(z)+16);
  };
  POIS.forEach(p=>T(p.e,p.n,p.x,p.z,'#fff'));
  ALL.filter(i=>i.type==='houses').forEach(h=>{
    const q=HP[h.id],own=(me.houses||[]).includes(h.id);
    T('🏠',h.name.split(',')[0]+(own?' (yours)':''),q[0],q[1],own?'#7dff9a':'#ffc266');
  });
  g.save();g.translate(X(PL.x),Y(PL.z));g.strokeStyle='#ff3b3b';g.lineWidth=3;
  g.beginPath();g.arc(0,0,16+4*Math.sin(Date.now()/250),0,7);g.stroke();
  g.rotate(-PL.h);g.fillStyle='#ff3b3b';g.strokeStyle='#fff';g.lineWidth=2;
  g.beginPath();g.moveTo(0,-12);g.lineTo(9,10);g.lineTo(0,5);g.lineTo(-9,10);g.closePath();g.fill();g.stroke();g.restore();
  g.fillStyle='#fff';g.font='15px sans-serif';g.textAlign='left';
  g.fillText('Sahara City Satellite Map · You are the red arrow · Press M or Esc to close',16,24);
}

/* ============================================================================
   ULTRA-REALISTIC 3D OPEN-WORLD ENGINE (THREE.JS PBR + POST-PROCESSING)
   ============================================================================ */
function startGame(){
  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0xd8c3a3,0.0014);

  const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.2,2400);
  const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.08;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  /* --- Post-Processing Pipeline (Bloom + Vignette/Color Grading) --- */
  const composer = new THREE.EffectComposer(renderer);
  const renderPass = new THREE.RenderPass(scene, cam);
  composer.addPass(renderPass);

  const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.38, 0.55, 0.85);
  composer.addPass(bloomPass);

  const colorGradeShader = {
    uniforms: { tDiffuse: { value: null }, darkness: { value: 0.42 }, offset: { value: 1.05 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform float darkness; uniform float offset; varying vec2 vUv;
      void main(){
        vec4 tex = texture2D(tDiffuse, vUv);
        vec2 uv = (vUv - vec2(0.5)) * vec2(offset);
        float vig = clamp(1.0 - dot(uv, uv) * darkness, 0.0, 1.0);
        // Subtle warm cinema contrast
        vec3 col = tex.rgb * vig;
        col = pow(col, vec3(0.97, 0.99, 1.02));
        gl_FragColor = vec4(col, tex.a);
      }`
  };
  const gradePass = new THREE.ShaderPass(colorGradeShader);
  composer.addPass(gradePass);

  /* --- PBR Environment Reflection Map (PMREM) --- */
  {
    const es=new THREE.Scene(),eg=new THREE.SphereGeometry(50,24,16),p=eg.attributes.position,cols=[];
    for(let i=0;i<p.count;i++){
      const y=p.getY(i)/50;
      const c=y<0?new THREE.Color(0xcfa568):new THREE.Color(0xd8e8f8).lerp(new THREE.Color(0x2b6cb8),clamp(y*1.6,0,1));
      cols.push(c.r,c.g,c.b);
    }
    eg.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
    es.add(new THREE.Mesh(eg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
    scene.environment=new THREE.PMREMGenerator(renderer).fromScene(es).texture;
  }

  /* --- Procedural High-Res PBR Texture Generators --- */
  const maxAniso = Math.min(16, renderer.capabilities.getMaxAnisotropy());
  const tx=(w,h,fn,rx=1,ry=1)=>{
    const c=document.createElement('canvas');c.width=w;c.height=h;
    fn(c.getContext('2d'),w,h);
    const t=new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);
    t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;
    return t;
  };
  const dataTx=(w,h,fn,rx=1,ry=1)=>{
    const c=document.createElement('canvas');c.width=w;c.height=h;
    fn(c.getContext('2d'),w,h);
    const t=new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);
    t.anisotropy=maxAniso;
    return t;
  };

  /* Multi-Channel Procedural PBR Generator: Paired Diffuse Albedo + Height Bump + Roughness */
  function makePBR(w, h, rx, ry, drawFn){
    const cDiff=document.createElement('canvas'); cDiff.width=w; cDiff.height=h;
    const cBump=document.createElement('canvas'); cBump.width=w; cBump.height=h;
    const cRough=document.createElement('canvas'); cRough.width=w; cRough.height=h;
    const gD=cDiff.getContext('2d'), gB=cBump.getContext('2d'), gR=cRough.getContext('2d');
    gB.fillStyle='#808080'; gB.fillRect(0,0,w,h);
    gR.fillStyle='#c8c8c8'; gR.fillRect(0,0,w,h);
    drawFn(gD, gB, gR, w, h);

    const map=new THREE.CanvasTexture(cDiff);
    const bumpMap=new THREE.CanvasTexture(cBump);
    const roughnessMap=new THREE.CanvasTexture(cRough);
    [map, bumpMap, roughnessMap].forEach(t=>{
      t.wrapS=t.wrapT=THREE.RepeatWrapping;
      t.repeat.set(rx, ry);
      t.anisotropy=maxAniso;
    });
    map.encoding=THREE.sRGBEncoding;
    return {map, bumpMap, roughnessMap};
  }

  const grain=(g,w,h,base,n,alpha=0.08)=>{
    g.fillStyle=base;g.fillRect(0,0,w,h);
    for(let i=0;i<n;i++){
      g.fillStyle=Math.random()<.5?`rgba(0,0,0,${alpha})`:`rgba(255,255,255,${alpha})`;
      g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2.5,1+Math.random()*2.5);
    }
  };
  const P=(color,rough=.75,metal=.05,o={})=>new THREE.MeshStandardMaterial(Object.assign({color,roughness:rough,metalness:metal},o));
  const add=(g,m,x,y,z,cs=true,rs=true)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=cs;o.receiveShadow=rs;scene.add(o);return o;};

  const glowTex=tx(64,64,g=>{
    const q=g.createRadialGradient(32,32,0,32,32,32);
    q.addColorStop(0,'rgba(255,255,255,1)');
    q.addColorStop(.3,'rgba(255,255,255,.35)');
    q.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=q;g.fillRect(0,0,64,64);
  });
  const glow=(c,s,x,y,z,par)=>{
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:c,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    sp.scale.set(s,s,1);sp.position.set(x,y,z);(par||scene).add(sp);return sp;
  };

  /* --- Atmospheric Sky Dome, Sun, Moon, Stars --- */
  const skyU={top:{value:new THREE.Color()},bot:{value:new THREE.Color()},sunDir:{value:new THREE.Vector3(0,1,0)}};
  const sky=new THREE.Mesh(new THREE.SphereGeometry(900,32,20),new THREE.ShaderMaterial({
    uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
    vertexShader:`varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`
      uniform vec3 top,bot,sunDir;varying vec3 p;
      void main(){
        float h=clamp(p.y*1.45+.04,0.,1.);
        vec3 col=mix(bot,top,pow(h,.58));
        float sunAmt=max(dot(p,normalize(sunDir)),0.0);
        col += vec3(1.0,0.75,0.45)*pow(sunAmt,12.0)*0.35;
        col += vec3(1.0,0.92,0.75)*pow(sunAmt,180.0)*0.9;
        gl_FragColor=vec4(col,1.);
      }`
  }));
  sky.renderOrder=-10;scene.add(sky);

  const sunM=new THREE.Mesh(new THREE.SphereGeometry(22,20,16),new THREE.MeshBasicMaterial({color:0xfff6d6,fog:false}));
  const sunG=glow(0xffd890,260,0,0,0);
  const moonT=tx(128,128,(g,w,h)=>{
    grain(g,w,h,'#dcdfe6',900);
    g.fillStyle='rgba(85,92,108,.38)';
    [[40,40,16],[85,70,22],[60,100,10],[95,30,9],[30,90,8]].forEach(([x,y,s])=>{g.beginPath();g.arc(x,y,s,0,7);g.fill();});
  });
  const moonM=new THREE.Mesh(new THREE.SphereGeometry(15,24,16),new THREE.MeshStandardMaterial({color:0,emissive:0xffffff,emissiveMap:moonT,roughness:1,fog:false}));
  const moonG=glow(0x9fb8ff,140,0,0,0);

  const sp=[];
  for(let i=0;i<1800;i++){
    const a=Math.random()*6.283,e=Math.acos(Math.random()),R=850;
    sp.push(R*Math.sin(e)*Math.cos(a),R*Math.cos(e),R*Math.sin(e)*Math.sin(a));
  }
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
  const stars=new THREE.Points(sg,new THREE.PointsMaterial({size:1.8,sizeAttenuation:false,transparent:true,fog:false,depthWrite:false}));
  stars.renderOrder=-9;
  scene.add(sunM,moonM,stars);

  /* --- Dynamic Lighting --- */
  const hemi=new THREE.HemisphereLight(0xd9ecff,0x9e6c3f,.6);scene.add(hemi);
  const key=new THREE.DirectionalLight(0xffffff,2.2);
  key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.00035;
  Object.assign(key.shadow.camera,{left:-95,right:95,top:95,bottom:-95,near:1,far:650});
  scene.add(key,key.target);

  /* --- Photorealistic Ground: Multi-Channel PBR Wind-Rippled Sahara Sand + Mediterranean Sea + Wet Beach --- */
  const sandPBR=makePBR(512,512,240,240,(gD,gB,gR,w,h)=>{
    gD.fillStyle='#ddb370'; gD.fillRect(0,0,w,h);
    gR.fillStyle='#dedede'; gR.fillRect(0,0,w,h);
    // Multi-octave wind-blown desert ripples with warm ochre troughs & golden crests
    for(let y=0;y<h;y+=8){
      const gradD=gD.createLinearGradient(0,y,0,y+8);
      gradD.addColorStop(0,'#c69650');
      gradD.addColorStop(0.45,'#ecc686');
      gradD.addColorStop(0.75,'#dfa95e');
      gradD.addColorStop(1,'#c69650');
      gD.fillStyle=gradD;

      const gradB=gB.createLinearGradient(0,y,0,y+8);
      gradB.addColorStop(0,'#444444');
      gradB.addColorStop(0.45,'#eaeaea');
      gradB.addColorStop(1,'#444444');
      gB.fillStyle=gradB;

      gD.beginPath(); gB.beginPath();
      for(let x=0;x<=w;x+=16){
        const wy=y + Math.sin(x*0.0368 + y*0.049)*3.2 + Math.cos(x*0.0736)*1.4;
        if(x===0){gD.moveTo(x,wy);gB.moveTo(x,wy);} else {gD.lineTo(x,wy);gB.lineTo(x,wy);}
      }
      gD.lineTo(w,y+8);gD.lineTo(0,y+8);gD.fill();
      gB.lineTo(w,y+8);gB.lineTo(0,y+8);gB.fill();
    }
    // Fine mineral & quartz grain speckles + sparkly specular sun glint pixels
    for(let i=0;i<24000;i++){
      const x=Math.random()*w, y=Math.random()*h, r=Math.random();
      gD.fillStyle=r<.35?'rgba(120,75,28,0.13)':(r<.8?'rgba(255,240,205,0.14)':'rgba(95,65,40,0.18)');
      gD.fillRect(x,y,1.5,1.5);
      gB.fillStyle=r<.5?'rgba(30,30,30,0.16)':'rgba(240,240,240,0.16)';
      gB.fillRect(x,y,1.5,1.5);
      if(r>0.92){
        // Quartz crystal micro-glint (low roughness)
        gR.fillStyle='#555555';
        gR.fillRect(x,y,1.5,1.5);
      }
    }
  });
  add(new THREE.PlaneGeometry(3000,3000).rotateX(-Math.PI/2),P(0xffffff,1.0,0,{
    map:sandPBR.map, bumpMap:sandPBR.bumpMap, bumpScale:1.15, roughnessMap:sandPBR.roughnessMap
  }),0,0,0,false);

  // Rolling Sahara Dunes outside the city perimeter
  const duneMat=P(0xe6be7e,1.0,0,{
    map:sandPBR.map, bumpMap:sandPBR.bumpMap, bumpScale:1.35, roughnessMap:sandPBR.roughnessMap
  });
  for(let i=0;i<36;i++){
    const ang=(i/36)*Math.PI*2;
    const rad=1050+Math.sin(i*3.7)*140;
    const dx=Math.cos(ang)*rad, dz=Math.sin(ang)*rad - 350;
    if(dz > 120) continue; // keep sea open
    const dune=new THREE.Mesh(new THREE.ConeGeometry(160+Math.random()*90, 32+Math.random()*35, 16), duneMat);
    dune.scale.set(1.8, 0.45, 1.1);
    dune.position.set(dx, 6, dz);
    dune.receiveShadow=true;
    scene.add(dune);
  }

  // Tell Atlas Mountains on the horizon with stratified sedimentary rock PBR texture
  const rockPBR=makePBR(512,512,4,3,(gD,gB,gR,w,h)=>{
    grain(gD,w,h,'#7b5c43',16000,0.11);
    grain(gB,w,h,'#808080',14000,0.22);
    gR.fillStyle='#e6e6e6'; gR.fillRect(0,0,w,h);
    // Geological rock strata bands & scree fissures
    for(let y=0;y<h;y+=14){
      gD.fillStyle=(y%28===0)?'rgba(55,38,24,0.22)':'rgba(185,150,115,0.16)';
      gB.fillStyle=(y%28===0)?'rgba(20,20,20,0.35)':'rgba(235,235,235,0.28)';
      gD.beginPath(); gB.beginPath();
      for(let x=0;x<=w;x+=32){
        const sy=y+Math.sin(x*0.025+y)*5;
        if(x===0){gD.moveTo(x,sy);gB.moveTo(x,sy);}else{gD.lineTo(x,sy);gB.lineTo(x,sy);}
      }
      gD.lineTo(w,y+9);gD.lineTo(0,y+9);gD.fill();
      gB.lineTo(w,y+9);gB.lineTo(0,y+9);gB.fill();
    }
  });
  const rockMat=P(0xffffff,1.0,0.02,{
    map:rockPBR.map, bumpMap:rockPBR.bumpMap, bumpScale:2.4, roughnessMap:rockPBR.roughnessMap, flatShading:true

        tg.addColorStop(0,'#8c3618'); tg.addColorStop(0.5,'#d9653b'); tg.addColorStop(1,'#8c3618');
        gD.fillStyle=tg; gD.fillRect(x,y,31,30);
        const bg=gB.createLinearGradient(x,y,x+32,y);
        bg.addColorStop(0,'#303030'); bg.addColorStop(0.5,'#f0f0f0'); bg.addColorStop(1,'#303030');
        gB.fillStyle=bg; gB.fillRect(x,y,31,30);
      }
    }
  });

  // Build the 6 Purchasable Luxury Houses at HP coordinates
  const houseConfigs={
    h1:{w:22,h:14,d:18,col:0xf5efe6,roof:0x2b6cb0,pool:false,tileRoof:false}, // Casbah flat, Algiers
    h2:{w:28,h:12,d:22,col:0xfff8ee,roof:0xffffff,pool:true, tileRoof:true},  // Oran seaside villa
    h3:{w:24,h:9, d:20,col:0xd49b63,roof:0xffffff,pool:true, tileRoof:true},  // Sahara desert lodge
    h4:{w:30,h:15,d:24,col:0xf0ece1,roof:0x2d3138,pool:true, tileRoof:false}, // Modern villa, Hydra
    h5:{w:24,h:38,d:24,col:0x1b364d,roof:0x111822,pool:false,tileRoof:false}, // Glass penthouse
    h6:{w:22,h:18,d:20,col:0x523a28,roof:0x1f1f24,pool:false,tileRoof:false}  // Loft near the Casino
  };
  Object.entries(HP).forEach(([id,[hx,hz]])=>{
    const cfg=houseConfigs[id];
    WB.push({x:hx,z:hz,hx:cfg.w/2+1,hz:cfg.d/2+1});
    const isGlass=id==='h5';
    add(new THREE.BoxGeometry(cfg.w,cfg.h,cfg.d),isGlass?facadeMats[3]:P(cfg.col,0.85,0.05,{
      map:stuccoPBR.map, bumpMap:stuccoPBR.bumpMap, bumpScale:0.35, roughnessMap:stuccoPBR.roughnessMap
    }),hx,cfg.h/2,hz);
    const rMat = cfg.tileRoof
      ? P(0xffffff,0.72,0.04,{map:roofTilePBR.map,bumpMap:roofTilePBR.bumpMap,bumpScale:0.6,roughnessMap:roofTilePBR.roughnessMap})
      : P(cfg.roof,.6);
    add(new THREE.BoxGeometry(cfg.w+1.4,1,cfg.d+1.4),rMat,hx,cfg.h+0.5,hz);
    // Panoramic windows
    add(new THREE.BoxGeometry(cfg.w*0.8,cfg.h*0.5,cfg.d+0.3),P(0x102233,.05,.9),hx,cfg.h*0.5,hz);
    if(cfg.pool){
      add(new THREE.BoxGeometry(12,0.3,7),P(0xffffff,.4,0,{map:promPBR.map}),hx,0.15,hz+cfg.d/2+6,false);
      add(new THREE.PlaneGeometry(10.5,5.5).rotateX(-Math.PI/2),P(0x1ad1ff,.04,.2,{bumpMap:seaBump,bumpScale:0.25}),hx,0.32,hz+cfg.d/2+6,false);
    }
    addPalm(hx-cfg.w/2-3,hz+cfg.d/2+2,1.1);
    addPalm(hx+cfg.w/2+3,hz+cfg.d/2+2,1.0);
  });

  // Procedural City Blocks (Haussmann / Algiers White City & Modern Towers)
  for(let gx=-820;gx<=820;gx+=46){
    for(let gz=-840;gz<=100;gz+=46){
      if(onRoad(gx,gz)) continue;
      // Keep clear of POIs & Houses
      const nearSpecial = POIS.some(p=>Math.hypot(gx-p.x,gz-p.z)<52) || Object.values(HP).some(([hx,hz])=>Math.hypot(gx-hx,gz-hz)<52);
      if(nearSpecial) continue;
      if((Math.abs(gx*17+gz*31)%10) < 2) continue; // open plazas

      const w=22 + (Math.abs(gx*7+gz)%14);
      const d=22 + (Math.abs(gx+gz*13)%14);
      const h=12 + (Math.abs(gx*3+gz*5)%42);
      const mat=facadeMats[Math.abs(gx+gz)%facadeMats.length];
      add(new THREE.BoxGeometry(w,h,d),mat,gx,h/2,gz);
      // Rooftop terrace & AC/satellite details
      add(new THREE.BoxGeometry(w+0.8,0.6,d+0.8),P(0xd8cfc0,.85,0,{map:promPBR.map}),gx,h+0.3,gz);
      WB.push({x:gx,z:gz,hx:w/2,hz:d/2});
    }
  }

  /* ============================================================================
     SCULPTED REALISTIC 3D VEHICLES (PEUGEOT 205, TOYOTA HILUX, SPORT COUPE)
     ============================================================================ */
  const tirePBR=makePBR(128,128,1,5,(gD,gB,gR,w,h)=>{
    grain(gD,w,h,'#1a1a1d',2500,0.08);
    gB.fillStyle='#808080'; gB.fillRect(0,0,w,h);
    gR.fillStyle='#cfcfcf'; gR.fillRect(0,0,w,h);
    // Deep directional tire tread blocks & circumferential rain grooves
    gD.fillStyle='#0c0c0e'; gB.fillStyle='#181818'; gR.fillStyle='#888888';
    gD.fillRect(36,0,8,h); gD.fillRect(84,0,8,h);
    gB.fillRect(36,0,8,h); gB.fillRect(84,0,8,h);
    for(let y=0;y<h;y+=16){
      gD.fillRect(6,y,26,6); gD.fillRect(48,y+8,32,6); gD.fillRect(96,y,26,6);
      gB.fillRect(6,y,26,6); gB.fillRect(48,y+8,32,6); gB.fillRect(96,y,26,6);
    }
  });
  const tireMat=P(0xffffff,1.0,0.04,{map:tirePBR.map, bumpMap:tirePBR.bumpMap, bumpScale:0.55, roughnessMap:tirePBR.roughnessMap});
  const rimMat=P(0xd8dde6,.18,0.95);
  const glassMat=new THREE.MeshPhysicalMaterial({color:0x0c1824,roughness:0.05,metalness:0.12,transmission:0.35,transparent:true,opacity:0.86,clearcoat:1});
  const chromeMat=P(0xffffff,.08,0.98);
  /* --- Input Controls (Keyboard, Mobile Pad, Mouse Camera Orbit) --- */
  const keys={};
  addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT') return;
    const k=e.key.toLowerCase();
    keys[k]=true;
    if(k==='v') camMode=(camMode+1)%3;
  });
  addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

  document.querySelectorAll('#pad button').forEach(btn=>{
    const k=btn.dataset.k;
    const dn=e=>{e.preventDefault();keys[k]=true;};
    const up=e=>{e.preventDefault();keys[k]=false;};
    btn.addEventListener('pointerdown',dn);
    btn.addEventListener('pointerup',up);
    btn.addEventListener('pointerleave',up);
    btn.addEventListener('pointercancel',up);
  });

  // Walk / Drive Mode Toggle
  $('bMode').onclick = () => {
    if(G.mode==='drive'){
      G.mode='walk';
      $('bMode').textContent='Drive';
      walkState.x = carState.x - Math.cos(carState.h)*2.2;
      walkState.z = carState.z + Math.sin(carState.h)*2.2;
      walkState.h = carState.h;
      playerHuman.root.visible = true;
      toast('Walking on foot · Walk back to your car and click Drive to enter');
    } else {
      const dist = Math.hypot(walkState.x - carState.x, walkState.z - carState.z);
      if(dist > 14){
        // Summon car nearby if player walked far away
        carState.x = walkState.x + Math.cos(walkState.h)*3;
        carState.z = walkState.z - Math.sin(walkState.h)*3;
        carState.h = walkState.h;
        carState.spd = 0;
        toast('Valet delivered your car!');
      }
      G.mode='drive';
      $('bMode').textContent='Walk';
      playerHuman.root.visible = false;
    }
  };

  // Smooth Mouse Orbit Camera
  let camYaw=0, camPitch=0.22, dragging=false, lastX=0, lastY=0, camMode=0;
  renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;});
  addEventListener('pointermove',e=>{
    if(!dragging) return;
    camYaw -= (e.clientX - lastX)*0.006;
    camPitch = clamp(camPitch + (e.clientY - lastY)*0.005, 0.05, 0.95);
    lastX=e.clientX; lastY=e.clientY;
  });
  addEventListener('pointerup',()=>{dragging=false;});

  addEventListener('resize',()=>{
    cam.aspect=innerWidth/innerHeight;
    cam.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    composer.setSize(innerWidth,innerHeight);
  });

  /* ============================================================================
     ARTICULATED 3D HUMAN CHARACTERS (PLAYER IN WALK MODE + AI PEDESTRIANS)
     ============================================================================ */
  const fabricPBR=makePBR(128,128,3,3,(gD,gB,gR,w,h)=>{
    gD.fillStyle='#ffffff'; gD.fillRect(0,0,w,h);
    gB.fillStyle='#808080'; gB.fillRect(0,0,w,h);
    gR.fillStyle='#e4e4e4'; gR.fillRect(0,0,w,h);
    // Woven cotton/linen textile cross-hatch micro-texture
    for(let y=0;y<h;y+=4){
      for(let x=0;x<w;x+=4){
        const alt=((x+y)%8===0);
        gD.fillStyle=alt?'rgba(0,0,0,0.06)':'rgba(255,255,255,0.06)';
        gD.fillRect(x,y,2,2);
        gB.fillStyle=alt?'#606060':'#a8a8a8';
        gB.fillRect(x,y,2,2);
      }
    }
  });
  const skinTones=[0xf1c27d,0xe0ac69,0xc68642,0x8d5524,0xffdbac];
  const shirtCols=[0xf8fafc,0x1d4ed8,0xdc2626,0x15803d,0xd97706,0x374151,0x7c3aed];
  const pantCols=[0x1e293b,0x334155,0x78350f,0x0f172a,0xd6d3d1];

  function buildHuman(seed=0){
    const g=new THREE.Group();
    const skin=P(skinTones[seed%skinTones.length],0.62,0.02);
    const shirt=P(shirtCols[(seed*3)%shirtCols.length],0.92,0.01,{map:fabricPBR.map,bumpMap:fabricPBR.bumpMap,bumpScale:0.15});
    const pants=P(pantCols[(seed*5)%pantCols.length],0.95,0.01,{map:fabricPBR.map,bumpMap:fabricPBR.bumpMap,bumpScale:0.18});
    const hairMat=P(0x181412,0.9);
    const shoeMat=P(0x111113,0.45,0.12);
    sunG.position.copy(sunM.position);
    sunM.visible = sunG.visible = sunY > -0.15;
    skyU.sunDir.value.set(sunX, sunY, -0.4).normalize();

    moonM.position.set(anchorX - sunX*620, -sunY*620, anchorZ - 260);
    moonG.position.copy(moonM.position);
    moonM.visible = moonG.visible = -sunY > -0.15;
    stars.position.set(anchorX, 0, anchorZ);
    stars.material.opacity = clamp(1 - dayAmt*1.6, 0, 0.9);

    key.position.set(anchorX + sunX*140, Math.max(30, sunY*180), anchorZ + 90);
    key.target.position.set(anchorX, 0, anchorZ);
    key.intensity = 0.25 + dayAmt*2.1;
    key.color.setHex(0xffffff).lerp(new THREE.Color(0xff9e54), duskAmt*0.7);
    key.castShadow = !!S.shadows;
    hemi.intensity = 0.22 + dayAmt*0.48;

    const nightFactor = clamp(1 - dayAmt*1.4, 0, 1);
    wins.forEach(m => m.emissiveIntensity = nightFactor * 1.3);
    streetLamps.forEach(l => {
      l.bulb.visible = nightFactor > 0.15;
      l.halo.visible = nightFactor > 0.15;
    });

    /* 2. Animate Sea Ripples & Swaying Palm Fronds */
    seaBump.offset.x += dt*0.025;
    seaBump.offset.y += dt*0.015;
    const windSway = Math.sin(now*0.0018)*0.05;
    palmFronds.forEach((c,idx) => c.rotation.z = windSway + Math.sin(now*0.0013+idx)*0.02);

    /* 3. Player Driving or Walking Physics */
    const fwd = (keys['w']||keys['arrowup']?1:0) - (keys['s']||keys['arrowdown']?1:0);
    const trn = (keys['a']||keys['arrowleft']?1:0) - (keys['d']||keys['arrowright']?1:0);
    const brk = keys[' '];

    if(G.mode==='drive' && playerCar){
      const {maxSpd, accel, handle} = playerCar.cfg;
      const hpFactor = 0.45 + 0.55*(G.hp/100);

      if(fwd > 0){
        carState.spd += accel * hpFactor * dt;
      } else if(fwd < 0){
        carState.spd -= (carState.spd > 1 ? accel*1.7 : accel*0.75) * dt;
      } else {
        carState.spd *= Math.pow(0.28, dt);
      }
      if(brk) carState.spd *= Math.pow(0.04, dt);
      carState.spd = clamp(carState.spd, -maxSpd*0.38, maxSpd*hpFactor);

      // Steering & dynamic suspension roll/pitch
      const targetSteer = trn * 0.48;
      carState.steer += (targetSteer - carState.steer) * Math.min(1, dt*10);
      if(Math.abs(carState.spd) > 0.35){
        const rev = carState.spd >= 0 ? 1 : -1;
        carState.h += carState.steer * handle * rev * clamp(Math.abs(carState.spd)/14, 0.25, 1.1) * dt;
      }

      const nx = carState.x + Math.sin(carState.h) * carState.spd * dt;
      const nz = carState.z + Math.cos(carState.h) * carState.spd * dt;

      // Building & Boundary Collision Detection
      let hit = false;
      if(nx < -890 || nx > 890 || nz < -890 || nz > 158) hit = true;
      for(const b of WB){
        if(Math.abs(nx - b.x) < b.hx + 1.1 && Math.abs(nz - b.z) < b.hz + 2.1){
          hit = true; break;
        }
      }

      if(hit){
        const impact = Math.abs(carState.spd);
        if(impact > 4){
          G.hp = Math.max(5, G.hp - impact*0.65);
          crashSnd(impact);
        }
        carState.spd = -carState.spd * 0.35;
      } else {
        carState.x = nx;
        carState.z = nz;
      }

      // Check Repair Station Auto-Service Pad (-150, -442)
      if(Math.hypot(carState.x - (-150), carState.z - (-442)) < 6.5 && G.hp < 99){
        G.hp = Math.min(100, G.hp + dt*35);
        if(G.hp >= 99.5) toast('🔧 Repair Station: Vehicle restored to 100%!');
      }

      // Update 3D Car Transform, Wheels, Suspension Tilt & Lights
      playerCar.root.position.set(carState.x, 0, carState.z);
      playerCar.root.rotation.y = carState.h;

      const targetRoll = -carState.steer * (carState.spd / maxSpd) * 0.14;
      const targetPitch = (fwd < 0 || brk ? 0.04 : (fwd > 0 ? -0.025 : 0));
      carState.roll += (targetRoll - carState.roll)*Math.min(1, dt*8);
      carState.pitch += (targetPitch - carState.pitch)*Math.min(1, dt*8);
      playerCar.body.rotation.z = carState.roll;
      playerCar.body.rotation.x = carState.pitch;

      playerCar.pivots.forEach(p => p.rotation.y = carState.steer);
      playerCar.wheels.forEach(w => w.rotation.x += carState.spd * dt * 2.2);

      // Brake lights & Night Headlights
      const braking = fwd < 0 || brk;
      playerCar.tlMat.color.setHex(braking ? 0xff1e1e : 0x660808);
      playerCar.spot.intensity = nightFactor > 0.2 ? 2.6 : 0;
      playerCar.hlHalos.forEach(h => h.visible = nightFactor > 0.2);

      // Exhaust & Damage Smoke
      if(Math.random() < 0.35){
        const exX = carState.x - Math.sin(carState.h)*2.3;
        const exZ = carState.z - Math.cos(carState.h)*2.3;
        spawnSmoke(exX, 0.35, exZ, false);
        if(G.hp < 45){
          const hdX = carState.x + Math.sin(carState.h)*1.6;
          const hdZ = carState.z + Math.cos(carState.h)*1.6;
          spawnSmoke(hdX, 1.05, hdZ, true);
        }
      }

      PL.x = carState.x; PL.z = carState.z; PL.h = carState.h;
      $('speedo').style.display = 'block';
      $('speedo').innerHTML = `<span>${Math.round(Math.abs(carState.spd)*3.2)}</span> km/h`;
      $('dmg').style.display = 'block';
      const bar = $('dmg').querySelector('i');
      bar.style.width = G.hp + '%';
      bar.style.background = G.hp > 60 ? '#4cd964' : (G.hp > 30 ? '#ffcc00' : '#ff3b30');

      // Engine Audio Synthesis
      if(A.ctx && A.on){
        const rpm = 48 + Math.abs(carState.spd)*3.4;
        A.e1.frequency.setTargetAtTime(rpm, A.ctx.currentTime, 0.05);
        A.e2.frequency.setTargetAtTime(rpm*1.5, A.ctx.currentTime, 0.05);
        A.eg.gain.setTargetAtTime(0.06 + Math.abs(carState.spd)*0.002, A.ctx.currentTime, 0.08);
      }
    } else {
      // WALK MODE ON FOOT
      $('speedo').style.display = 'none';
      $('dmg').style.display = 'none';
      if(A.ctx && A.eg) A.eg.gain.setTargetAtTime(0, A.ctx.currentTime, 0.1);

      walkState.h += trn * 2.8 * dt;
      const moveSpd = fwd * 7.5;
      const nx = walkState.x + Math.sin(walkState.h) * moveSpd * dt;
      const nz = walkState.z + Math.cos(walkState.h) * moveSpd * dt;
      let blocked = nx < -895 || nx > 895 || nz < -895 || nz > 162;
      for(const b of WB){
        if(Math.abs(nx - b.x) < b.hx + 0.5 && Math.abs(nz - b.z) < b.hz + 0.5){ blocked = true; break; }
      }
      if(!blocked){ walkState.x = nx; walkState.z = nz; }
      walkState.phase += Math.abs(moveSpd) * dt * 1.6;
      playerHuman.root.position.set(walkState.x, 0, walkState.z);
      playerHuman.root.rotation.y = walkState.h;
      playerHuman.animate(walkState.phase, Math.abs(moveSpd));
      PL.x = walkState.x; PL.z = walkState.z; PL.h = walkState.h;
    }

    /* 4. Update AI Traffic Vehicles */
    trafficCars.forEach(tc => {
      tc.mesh.root.visible = !!S.traffic;
      if(!S.traffic) return;
      // Slow down if player is right ahead
      const distPlayer = Math.hypot(tc.x - carState.x, tc.z - carState.z);
      const curSpd = distPlayer < 13 ? 0 : tc.spd;
      if(tc.rt.axis === 'z'){
        tc.z += tc.rt.dir * curSpd * dt;
        if(tc.z > tc.rt.hi) tc.z = tc.rt.lo;
        if(tc.z < tc.rt.lo) tc.z = tc.rt.hi;
      } else {
        tc.x += tc.rt.dir * curSpd * dt;
        if(tc.x > tc.rt.hi) tc.x = tc.rt.lo;
        if(tc.x < tc.rt.lo) tc.x = tc.rt.hi;
      }
      tc.mesh.root.position.set(tc.x, 0, tc.z);
      tc.mesh.wheels.forEach(w => w.rotation.x += curSpd * dt * 2.1);
      tc.mesh.spot.intensity = nightFactor > 0.2 ? 1.6 : 0;
      tc.mesh.hlHalos.forEach(h => h.visible = nightFactor > 0.2);
    });

    /* 5. Update Articulated AI Pedestrians */
    pedestrians.forEach(p => {
      p.hum.root.visible = !!S.people;
      if(!S.people) return;
      if(p.alongProm){
        p.x += p.dir * p.spd * dt;
        if(p.x > 850) p.dir = -1;
        if(p.x < -850) p.dir = 1;
        p.hum.root.rotation.y = p.dir > 0 ? Math.PI/2 : -Math.PI/2;
      } else {
        p.z += p.dir * p.spd * dt;
        if(p.z > 135) p.dir = -1;
        if(p.z < -850) p.dir = 1;
        p.hum.root.rotation.y = p.dir > 0 ? 0 : Math.PI;
      }
      p.phase += p.spd * dt * 4.5;
      p.hum.root.position.set(p.x, 0, p.z);
      p.hum.animate(p.phase, p.spd*2.5);
    });

    /* 6. Update Smoke Particles */
    for(const p of smokePool){
      if(p.life <= 0) continue;
      p.life -= dt*1.3;
      p.m.position.x += p.vx*dt;
      p.m.position.y += p.vy*dt;
      p.m.position.z += p.vz*dt;
      p.m.scale.addScalar(dt*0.9);
      p.m.material.opacity = Math.max(0, p.life*0.35);
    }

    /* 7. Dynamic Chase / Orbit Camera */
    if(!dragging && Math.abs(carState.spd) > 2 && G.mode==='drive'){
      camYaw *= Math.pow(0.15, dt); // gently re-center behind car when driving
    }
    const targetX = G.mode==='drive' ? carState.x : walkState.x;
    const targetZ = G.mode==='drive' ? carState.z : walkState.z;
    const targetH = G.mode==='drive' ? carState.h : walkState.h;

    if(camMode === 2 && G.mode==='drive'){
      // Hood / First-person cockpit camera
      cam.position.set(targetX + Math.sin(targetH)*0.4, 1.45, targetZ + Math.cos(targetH)*0.4);
      cam.lookAt(targetX + Math.sin(targetH)*25, 1.2, targetZ + Math.cos(targetH)*25);
    } else {
      const dist = G.mode==='drive' ? (camMode===1 ? 13.5 : 8.5) : 5.2;
      const totalYaw = targetH + camYaw;
      const desiredX = targetX - Math.sin(totalYaw)*Math.cos(camPitch)*dist;
      const desiredY = (G.mode==='drive'?1.4:1.6) + Math.sin(camPitch)*dist;
      const desiredZ = targetZ - Math.cos(totalYaw)*Math.cos(camPitch)*dist;
      cam.position.lerp(new THREE.Vector3(desiredX, desiredY, desiredZ), Math.min(1, dt*10));
      cam.lookAt(targetX, G.mode==='drive'?1.2:1.4, targetZ);
    }

    /* 8. HUD Clock & Live Map Refresh */
    clockTick += dt;
    if(clockTick > 0.5){
      clockTick = 0;
      const tStr = fmt(hr);
      $('clock').textContent = tStr;
      $('pClock').textContent = tStr;
      const wT = $('wT'); if(wT) wT.textContent = tStr;
      if(mapOn) drawMap();
    }

    /* 9. Render Scene (with Post-Processing Bloom & Tone Grading) */
    if(S.bloom){
      composer.render();
    } else {
      renderer.render(scene, cam);
    }
  }

  requestAnimationFrame(loop);
}
</script>
</body>
</html>
